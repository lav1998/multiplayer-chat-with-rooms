<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Chat</title>
</head>
<body>
    <header>
        <h1>Multiplayer Chat</h1>
    </header>

    <!-- Room & Identity Controls -->
    <section id="room-section">
        <form id="join-form">
            <label for="username-input">Username:</label>
            <input type="text" id="username-input" placeholder="e.g. Alice" required>

            <label for="room-input">Room:</label>
            <input type="text" id="room-input" placeholder="e.g. general" required>

            <button type="submit" id="join-btn">Join Room</button>
            <button type="button" id="leave-btn" disabled>Leave Room</button>
        </form>
        <p id="connection-status" class="status">Status: Disconnected</p>
    </section>

    <!-- Message Display Area -->
    <section id="chat-section">
        <ul id="messages-list" class="messages-list">
            <!-- Messages will be appended here as <li> items -->
        </ul>

        <!-- Message Input & Send -->
        <form id="message-form">
            <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" disabled required>
            <button type="submit" id="send-btn" disabled>Send</button>
        </form>
    </section>

    <script>
        // DOM Elements
        const joinForm = document.getElementById('join-form');
        const usernameInput = document.getElementById('username-input');
        const roomInput = document.getElementById('room-input');
        const joinBtn = document.getElementById('join-btn');
        const leaveBtn = document.getElementById('leave-btn');
        const connectionStatus = document.getElementById('connection-status');
        
        const messagesList = document.getElementById('messages-list');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');

        let ws = null;

        function addMessage(text) {
            const li = document.createElement('li');
            li.textContent = text;
            messagesList.appendChild(li);
        }

        joinForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Connect to WebSocket
            const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            const room = encodeURIComponent(roomInput.value);
            const username = encodeURIComponent(usernameInput.value);
            const wsUrl = `${protocol}//${window.location.host}/ws/${room}/${username}`;
            
            ws = new WebSocket(wsUrl);

            // Connection opened
            ws.onopen = () => {
                connectionStatus.textContent = `Status: Connected to ${roomInput.value} as ${usernameInput.value}`;
                joinBtn.disabled = true;
                usernameInput.disabled = true;
                roomInput.disabled = true;
                leaveBtn.disabled = false;
                
                messageInput.disabled = false;
                sendBtn.disabled = false;
            };

            // Listen for messages
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                // Format timestamp locally
                const date = new Date(data.timestamp);
                const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                
                // Construct display string
                let displayText = `[${timeStr}] `;
                if (data.type === 'system') {
                    displayText += `* ${data.text} *`;
                } else {
                    displayText += `${data.username}: ${data.text}`;
                }
                
                addMessage(displayText);
            };

            // Connection closed
            ws.onclose = () => {
                connectionStatus.textContent = "Status: Disconnected";
                joinBtn.disabled = false;
                usernameInput.disabled = false;
                roomInput.disabled = false;
                leaveBtn.disabled = true;
                
                messageInput.disabled = true;
                sendBtn.disabled = true;
                
                ws = null;
            };
        });

        // Leave Room / Disconnect
        leaveBtn.addEventListener('click', () => {
            if (ws) {
                ws.close();
            }
        });

        // Send Message
        messageForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const msg = messageInput.value.trim();
            if (ws && msg) {
                ws.send(msg);
                messageInput.value = '';
            }
        });
    </script>
</body>
</html>
